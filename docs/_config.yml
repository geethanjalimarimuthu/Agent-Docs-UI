remote_theme: just-the-docs/just-the-docs

plugins:
  - jekyll-remote-theme

url: https://geethanjalimarimuthu.github.io
baseurl: /Agent-Docs-UI

title: Polaris AI Agents UI
description: Build and manage AI agents with visual workflows

# Enable search
search_enabled: true
search:
  heading_level: 2

# Navigation
nav_sort: case_insensitive

# Branding
logo: /assets/images/logo.png
favicon_ico: /assets/images/favicon.ico

# Footer
footer_content: "Copyright &copy; 2025 Atos. All rights reserved."

# Customization
color_scheme: light
enable_copy_code_button: true

# Collections
collections:
  docs:
    output: true
    permalink: /docs/:path/
